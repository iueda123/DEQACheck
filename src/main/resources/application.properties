# Server configuration
server.port=8080

# Vaadin configuration
#vaadin.launch-browser=false
vaadin.launch-browser=true
# Production mode enabled so _index.html is required on classpath
vaadin.productionMode=true
#vaadin.productionMode=false

# Authentication configuration
# Change these values for your environment
# Admin user (full access)
app.security.admin.username=admin
app.security.admin.password=admin2025

# Guest user (limited access: Main and QASummaryPage only)
app.security.guest.username=guest
app.security.guest.password=guest2025

# Ueda user (same access as guest)
app.security.ueda.username=ueda
app.security.ueda.password=ueda2025

# Takamatsu user (same access as guest)
app.security.takamatsu.username=takamatsu
app.security.takamatsu.password=takamatsu2025

# Saito user (same access as guest)
app.security.saito.username=saito
app.security.saito.password=saito2025

# Takahashi user (same access as guest)
app.security.takahashi.username=takahashi
app.security.takahashi.password=takahashi2025

# Shibukawa user (same access as guest)
app.security.shibukawa.username=shibukawa
app.security.shibukawa.password=shibukawa2025

# Tamura user (same access as guest)
app.security.tamura.username=tamura
app.security.tamura.password=tamura2025

# Etani user (same access as guest)
app.security.etani.username=etani
app.security.etani.password=etani2025

# Logging configuration
logging.file.name=logs/deqacheck-vaadin.log
logging.level.iu.SpringBoot.Vaadin=INFO
logging.level.UI_ACTIONS=INFO


